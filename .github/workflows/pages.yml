# SPDX-License-Identifier: CC0-1.0
# Publishes site/ (with the app icon and screenshots) to GitHub Pages.
name: Website

on:
  push:
    branches: [master, main]
    paths: [site/**, docs/screenshots/**, data/icons/io.github.melvincouwez.Boomerang.svg,
            .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # The site is published from the public repository only: the private one has no
    # GitHub Pages, and every push there used to fail and send a mail. Both owner names
    # are accepted while the account melvincouwez-alt is renamed Melvin-Cwz.
    if: github.repository == 'Melvin-Cwz/boomerang' || github.repository == 'melvincouwez-alt/boomerang'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp data/icons/io.github.melvincouwez.Boomerang.svg _site/icon.svg
          mkdir -p _site/screenshots
          cp -r docs/screenshots/. _site/screenshots/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
